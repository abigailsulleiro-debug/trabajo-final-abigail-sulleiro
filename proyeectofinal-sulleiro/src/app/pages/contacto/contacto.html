<section class="contact-section">
    <div class="container">
        <div class="contact-wrapper">
            
            <!-- Columna 1: Información de Contacto -->
            <div class="contact-info">
                <h2 class="brand-title">SulleiroRM</h2>
                <p class="contact-subtitle">¿Tienes alguna duda o proyecto en mente? Ponete en contacto con nosotros hoy mismo.</p>
                
                <div class="info-items">
                    <div class="info-item">
                        <span class="icon">✉️</span>
                        <div>
                            <h3>Escríbenos</h3>
                            <a href="mailto:Hola@sulleiro.como">Hola@sulleiro.como</a>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <span class="icon">📞</span>
                        <div>
                            <h3>Llámanos</h3>
                            <a href="tel:+541145678900">+54 11 4567-8900</a>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <span class="icon">📸</span>
                        <div>
                            <h3>Síguenos</h3>
                            <a href="https://instagram.com" target="_blank">@sulleiro.rm</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna 2: Formulario de Contacto Premium -->
            <div class="contact-form-container">
                <form class="contact-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label for="name">Nombre completo</label>
                        <input type="text" id="name" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Mensaje</label>
                        <textarea id="message" rows="4" placeholder="¿En qué podemos ayudarte?" required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Enviar mensaje</button>
                </form>
            </div>

        </div>
    </div>
</section>
